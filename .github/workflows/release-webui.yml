name: Release Hearthroot Control
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require persistent signing certificate
        env:
          KEYSTORE_B64: ${{ secrets.HEARTHROOT_DEBUG_KEYSTORE_B64 }}
          CERT_SHA256: ${{ secrets.HEARTHROOT_COMPANION_CERT_SHA256 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing keystore secret: publication blocked'; exit 1; }
          test -n "$CERT_SHA256" || { echo 'Missing certificate digest secret: publication blocked'; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install persistent debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.HEARTHROOT_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          chmod 700 "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build Companion
        working-directory: companion-src
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify Companion signing certificate
        env:
          CERT_SHA256: ${{ secrets.HEARTHROOT_COMPANION_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK='companion-src/app/build/outputs/apk/debug/app-debug.apk'
          SIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          echo "Using apksigner: $SIGNER"
          "$SIGNER" verify --print-certs "$APK"
          ACTUAL="$("$SIGNER" verify --print-certs "$APK" | sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([[:xdigit:]]{64})[[:space:]]*$/\1/p' | head -1)"
          echo "Checking restored keystore certificate"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep 'SHA256:'
          normalize_cert() {
            printf '%s' "$1" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]'
          }
          EXPECTED="$(normalize_cert "$CERT_SHA256")"
          ACTUAL="$(normalize_cert "$ACTUAL")"
          if [[ ! "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Invalid expected certificate digest format'
            exit 1
          fi
          if [[ ! "$ACTUAL" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Could not extract APK signing certificate digest'
            exit 1
          fi
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "APK certificate: $ACTUAL"
            echo 'Companion certificate mismatch: publication blocked'
            exit 1
          fi
          echo 'Companion signing certificate verified successfully'
      - name: Package module
        run: bash tools/package-module.sh
      - name: Publish prerelease only on matching tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version=//p' module.prop | head -1)"
          [[ "$GITHUB_REF_NAME" == "$VERSION" ]] || { echo 'Tag/version mismatch'; exit 1; }
          gh release create "$VERSION" "dist/Hearthroot-Control-${VERSION}.zip" --title "Hearthroot Control $VERSION" --notes-file "RELEASE_NOTES-${VERSION}.md" --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: Hearthroot-Control-Signed
          path: dist/*.zip
          if-no-files-found: error
