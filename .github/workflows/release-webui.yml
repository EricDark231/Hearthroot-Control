name: Release Hearthroot Control

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate module
        shell: bash
        run: |
          set -euo pipefail
          test -f module.prop
          test -f webroot/index.html

          VERSION=$(sed -n 's/^version=//p' module.prop | head -n 1)

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          zip -r "dist/Hearthroot-Control-${VERSION}.zip" \
            module.prop \
            webroot/

          unzip -t "dist/Hearthroot-Control-${VERSION}.zip"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != "$VERSION" ]]; then
            echo "Tag and module version do not match"
            exit 1
          fi

          gh release create "$VERSION" \
            "dist/Hearthroot-Control-${VERSION}.zip" \
            --title "Hearthroot Control $VERSION" \
            --generate-notes \
            --prerelease
