name: Build Hearthroot Control
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Companion (CI debug certificate, not for release)
        working-directory: companion-src
        run: gradle --no-daemon :app:assembleDebug
      - name: Package complete module
        run: bash tools/package-module.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Hearthroot-Control-CI
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
